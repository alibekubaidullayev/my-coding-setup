# ── basics ────────────────────────────────────────────────────────────────────
# zsh wherever it lives (/bin/zsh on macOS, /usr/bin/zsh on most Linux)
if-shell '[ -x /bin/zsh ]' 'set -g default-shell /bin/zsh' 'set -g default-shell /usr/bin/zsh'
set -g default-terminal "tmux-256color"
# Tell tmux what ghostty can do. Reset first so `prefix r` doesn't stack copies.
#   RGB truecolor · usstyle undercurl · extkeys C-S-x / S-Enter reach apps
#   sync flicker-free redraws · hyperlinks OSC 8 links stay clickable
set -su terminal-overrides
set -su terminal-features
set -sa terminal-features ",xterm-ghostty:RGB:usstyle:extkeys:sync:hyperlinks:strikethrough:overline"
set -sa terminal-features ",xterm-256color:RGB:usstyle"
set -s extended-keys on
set -s extended-keys-format csi-u
set -g mouse on
# 0 can split terminal replies (nvim's OSC 11 colour query) and leak them into the pane
set -g escape-time 10
set -g history-limit 100000
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
# keep window numbers stable when one closes (2 stays 2 after 1 is gone)
set -g renumber-windows off
setw -g mode-keys vi
# killing a session (or its last window) switches to another one instead of detaching
set -g detach-on-destroy off
# ghostty window/tab title follows the session and window
set -g set-titles on
set -g set-titles-string "#S · #W"
# claude's process name is its version ("2.1.283"): name those windows "claude"
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}}#{?pane_dead,[dead],}'
# windows with new output get the (subtle) activity style; no status-line message
setw -g monitor-activity on
set -g visual-activity off

# ta orders windows by when you last visited them, not by when they last printed
set-hook -g 'session-window-changed[42]' 'run-shell -b "tmux set -w -t #{window_id} @ta_visit \$(date +%s)"'
set-hook -g 'client-session-changed[42]' 'run-shell -b "tmux set -w -t #{window_id} @ta_visit \$(date +%s)"'

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

unbind x
bind x kill-pane

# splits / new windows open where you are
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# vi copy mode: v select, C-v block, y copy to the system clipboard
# (pbcopy on macOS, wl-copy / xclip on Linux; tmux pipes copies into copy-command)
if-shell 'command -v pbcopy' 'set -s copy-command pbcopy' \
  "if-shell '[ -n \"\$WAYLAND_DISPLAY\" ] && command -v wl-copy' 'set -s copy-command wl-copy' 'set -s copy-command \"xclip -selection clipboard\"'"
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# popups: prefix+w / prefix+j session/window picker · prefix+g lazygit · prefix+t scratch shell
# (ta opens its own popup, so size and the "current window" logic live in one place)
bind j run-shell -b 'cd #{q:pane_current_path} && TMUX_PANE=#{pane_id} ~/.local/bin/ta'
bind w run-shell -b 'cd #{q:pane_current_path} && TMUX_PANE=#{pane_id} ~/.local/bin/ta'
bind g display-popup -E -w 92% -h 90% -d "#{pane_current_path}" -b rounded -S "fg=#444444" -T " lazygit " lazygit
bind t display-popup -E -w 80% -h 75% -d "#{pane_current_path}" -b rounded -S "fg=#444444" -T " scratch "

# ── theme: lackluster (matches nvim lackluster-mint + ghostty) ────────────────
# near-black, grayscale, one muted mint accent
set -g status-style "bg=#101010,fg=#555555"
set -g status-left-style default
set -g status-right-style default
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#deeeed,bold] #S #[fg=#2a2a2a,nobold]│ "
set -g status-right "#{?client_prefix,#[fg=#789978]● prefix  ,}#[fg=#555555]#{b:pane_current_path}  #[fg=#7a7a7a]%H:%M "
set -g window-status-separator "  "
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-format "#[fg=#555555]  #I #W"
set -g window-status-current-format "#[fg=#789978]● #[fg=#deeeed,bold]#I #W#{?window_zoomed_flag,#[fg=#7a7a7a#,nobold] 󰊓,}"
set -g window-status-activity-style "fg=#aaaaaa"
set -g window-status-bell-style "fg=#ffaa88"

set -g pane-border-lines single
set -g pane-border-style "fg=#2a2a2a"
set -g pane-active-border-style "fg=#555555"
set -g message-style "bg=#191919,fg=#deeeed"
set -g message-command-style "bg=#191919,fg=#aaaaaa"
set -g mode-style "bg=#cccccc,fg=#000000"
set -g copy-mode-match-style "bg=#708090,fg=#000000"
set -g copy-mode-current-match-style "bg=#cccccc,fg=#000000"
set -g popup-style "bg=#101010"
set -g popup-border-style "fg=#444444"
set -g popup-border-lines rounded
set -g menu-style "bg=#191919,fg=#aaaaaa"
set -g menu-selected-style "bg=#cccccc,fg=#000000"
set -g menu-border-style "fg=#444444"
set -g clock-mode-colour "#7a7a7a"

# ── plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# sessions survive reboots: saved every 15 min, restored when tmux starts
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
# claude panes come back as claude (resume picker) instead of a bare shell
set -g @resurrect-processes '"~claude->claude --resume"'

run '~/.tmux/plugins/tpm/tpm'
